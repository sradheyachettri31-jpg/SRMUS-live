<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SRMUS Live | University Portal</title>

  <!-- SRM University Sikkim Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/images/srm_logo.jpg" />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>

<body>
  <!-- Toast Notification Container -->
  <div class="toast-container" id="app-toast-container"></div>

  <!-- App Main Wrapper -->
  <main class="app-main-wrapper">
    <!-- Phone Frame Container -->
    <div class="phone-device-frame" id="app-phone-frame">
      <!-- Phone Top Speaker & Camera Notch -->
      <div class="phone-notch-area">
        <div class="notch-speaker-bar"></div>
        <div class="notch-camera-dot"></div>
      </div>

      <!-- Live Mobile Status Bar -->
      <div class="phone-status-bar">
        <span id="phone-clock-display">09:41</span>
        <div class="status-bar-icons">
          <i data-lucide="signal" style="width: 13px; height: 13px;"></i>
          <i data-lucide="wifi" style="width: 13px; height: 13px;"></i>
          <i data-lucide="battery" style="width: 15px; height: 15px;"></i>
        </div>
      </div>

      <!-- Persistent App Bar: Sidebar Toggle, Back Button & Active Module Title -->
      <div class="app-topbar" id="app-topbar">
        <button class="topbar-btn topbar-menu-btn" id="btn-sidebar-open" type="button" title="Open modules sidebar"
          aria-label="Open modules sidebar">
          <i data-lucide="menu" style="width: 17px; height: 17px;"></i>
        </button>

        <button class="topbar-btn topbar-back-btn" id="back-btn" type="button" title="Go back to previous screen"
          aria-label="Go back">
          <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
          <span>Back</span>
        </button>

        <span class="topbar-module-title" id="app-module-title">SRMUS Live</span>

        <span class="topbar-live-pill" title="Live university feed">
          <span class="topbar-live-dot"></span>
          <span>Live</span>
        </span>
      </div>

      <!-- Scrollable Main Screen Root with Vertical Sliding Animation -->
      <div class="app-screen-container" id="app-screen-root">
        <div class="loading-state">
          <p>Loading SRMUS Live...</p>
        </div>
      </div>

      <!-- Phone Bottom Home Gesture Bar -->
      <div class="phone-home-indicator-bar"></div>

      <!-- Sidebar Backdrop Overlay -->
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <!-- Module Sidebar: organised navigation for every module -->
      <aside class="app-sidebar" id="app-sidebar" aria-label="Modules sidebar">
        <div class="sidebar-header">
          <div class="sidebar-brand">
            <div class="brand-crest-box">
              <img src="assets/images/srm_logo.jpg" alt="SRM University Sikkim" class="brand-crest-img"
                onerror="this.onerror=null;this.src='https://www.iaspaper.net/wp-content/uploads/2018/10/SRM-University-Sikkim-150x150.jpg'" />
            </div>
            <div class="sidebar-brand-text">
              <span class="sidebar-brand-title">SRMUS Live</span>
              <span class="sidebar-brand-sub">SRM University Sikkim</span>
            </div>
          </div>
          <button class="sidebar-close-btn" id="btn-sidebar-close" type="button" title="Close menu" aria-label="Close menu">
            <i data-lucide="x" style="width: 15px; height: 15px;"></i>
          </button>
        </div>

        <div class="sidebar-scroll" id="sidebar-nav-list"></div>
        <div class="sidebar-footer" id="sidebar-footer"></div>
      </aside>
    </div>
  </main>

  <!-- Application Entrypoint (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>

</html>
